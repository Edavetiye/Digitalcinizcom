<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#3d060b">
<title>Taha &amp; Melis — Düğün Davetiyesi</title>
<style>
/* ==========================================================================
   WED-003 • Dijital Düğün Davetiyesi
   Akış: 1 Kapak → 2 Açık zarf (plak) → 3 Hikayemiz → 4 Ailemiz → 5 RSVP
         Detay sayfası, 3. sayfadaki "Detaylar İçin Tıkla" ile açılır.
   Görseller ASSETS objesine base64 olarak gömülür (script sonunda).
   ========================================================================== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1b0407}
body{font-family:Georgia,"Times New Roman",serif;overscroll-behavior:none}

#stage{position:fixed;inset:0;overflow:hidden;background:#1b0407}

.page{position:absolute;inset:0;pointer-events:none;opacity:1;
  transform:translate3d(0,100%,0);will-change:transform;
  transition:transform 1s cubic-bezier(.22,.61,.36,1), opacity .75s ease}
.page.on{transform:translate3d(0,0,0);opacity:1;pointer-events:auto;z-index:2}
.page.above{transform:translate3d(0,-30%,0);opacity:0;z-index:1}

/* kenar boşluklarını görselin bulanık kopyası doldurur */
.bleed{position:absolute;inset:0;background-size:cover;background-position:center;
  filter:blur(34px) brightness(.65) saturate(.9);transform:scale(1.15)}
.frame{position:absolute;overflow:hidden;transform:scale(1.035);
  transition:transform 1.25s cubic-bezier(.22,.61,.36,1), filter 1.2s ease}
.page.on .frame{transform:scale(1)}
.art{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat}

/* ---- dokunma alanları ---- */
.hot{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;
  transition:transform .3s cubic-bezier(.22,.61,.36,1)}
.hot:active{transform:scale(.93)}
.hot:focus-visible{outline:2px solid rgba(255,255,255,.9);outline-offset:5px;border-radius:8px}
.round{border-radius:50%}

/* mühür nabzı */
#seal-hit::after{content:"";position:absolute;inset:-14%;border-radius:50%;
  border:1px solid rgba(255,255,255,.5);animation:pulse 2.8s cubic-bezier(.22,.61,.36,1) infinite}
@keyframes pulse{0%{transform:scale(.86);opacity:0}30%{opacity:.7}100%{transform:scale(1.5);opacity:0}}
body.opening #seal-hit::after{animation:none;opacity:0;transition:opacity .3s}

/* ---- 1. sayfa: mühre dokununca yumuşak geçiş ---- */
body.opening #p1 .frame{transform:scale(1.09);filter:brightness(1.05)}

/* ---- 2. sayfa: plak ---- */
#vinyl{position:absolute;border-radius:50%;overflow:hidden;border:0;padding:0;cursor:pointer;
  background-repeat:no-repeat;
  animation:spin 3.6s linear infinite;animation-play-state:paused;
  box-shadow:0 8px 26px rgba(0,0,0,.35);transition:box-shadow .6s ease, transform .3s ease}
#vinyl:active{transform:scale(.97)}
#vinyl.playing{box-shadow:0 12px 38px rgba(0,0,0,.5)}
@keyframes spin{to{transform:rotate(360deg)}}
#vinyl::after{content:"";position:absolute;inset:0;border-radius:50%;opacity:0;
  background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.2),transparent 58%);
  transition:opacity .7s ease}
#vinyl.playing::after{opacity:1}
/* çalarken plağın çevresinde ince halka */
#vinyl-ring{position:absolute;border-radius:50%;pointer-events:none;
  border:1px solid rgba(255,255,255,.45);opacity:0;transition:opacity .6s ease}
#vinyl-ring.on{opacity:1;animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.16);opacity:0}}

/* ---- RSVP penceresi ---- */
#modal{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:rgba(14,6,8,.66);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  opacity:0;visibility:hidden;transition:opacity .45s ease, visibility 0s .45s}
#modal.on{opacity:1;visibility:visible;transition:opacity .45s ease, visibility 0s 0s}
.sheet{position:relative;width:min(92%,540px);height:min(78%,760px);background:#f2ece2;
  display:flex;flex-direction:column;box-shadow:0 26px 70px rgba(0,0,0,.45);
  transform:translateY(20px) scale(.97);opacity:0;
  transition:transform .55s cubic-bezier(.22,.61,.36,1), opacity .45s ease}
#modal.on .sheet{transform:none;opacity:1}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;
  border-bottom:1px solid rgba(31,28,25,.15)}
.sheet-bar span{font:400 11px/1 system-ui,sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#2b2622}
.sheet-close{border:0;background:transparent;font:300 26px/1 system-ui,sans-serif;color:#2b2622;cursor:pointer;padding:0 6px}
.sheet-body{position:relative;flex:1;background:#f2ece2}
.sheet iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f2ece2}
#rsvp-fallback{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;padding:8% 12%;text-align:center;background:#f2ece2}
#rsvp-fallback.show{display:flex}
#rsvp-fallback p{font:400 14px/1.7 system-ui,sans-serif;color:#5a524a}
#rsvp-open{border:1px solid #8a7a63;background:transparent;color:#3a332c;cursor:pointer;
  padding:12px 26px;font:400 12px/1 system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase}
.sheet-foot{flex:0 0 auto;padding:10px;text-align:center;border-top:1px solid rgba(31,28,25,.12)}
.sheet-foot button{border:0;background:transparent;color:#6b6154;cursor:pointer;
  font:400 11px/1 system-ui,sans-serif;letter-spacing:.1em;text-decoration:underline}

/* ---- görseli beklenen sayfalar ---- */
.ph .art{background:repeating-linear-gradient(135deg,#2c1418 0 22px,#331a1e 22px 44px)}
.ph .slot{display:flex}
.slot{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;
  padding:0 12%;font:500 13px/1.9 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.55);pointer-events:none}
.slot::before{content:"";position:absolute;inset:7% 9%;border:1px dashed rgba(255,255,255,.22)}
.ph .hot{outline:1px dashed rgba(255,255,255,.3)}

#hint{position:absolute;left:0;right:0;bottom:calc(3% + env(safe-area-inset-bottom));text-align:center;z-index:30;
  font:400 10px/1 system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.5);opacity:0;transition:opacity .6s ease;pointer-events:none}
#hint.on{opacity:1}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important}
  .page,.frame{transition-duration:.2s!important}
  #vinyl{animation:none!important}
}
</style>
</head>
<body>
<div id="stage">

  <!-- 1 • KAPAK -->
  <section class="page on" id="p1" data-w="1366" data-h="2405">
    <div class="bleed" data-img="cover"></div>
    <div class="frame">
      <div class="art" data-img="cover"></div>
      <button class="hot round" id="seal-hit" aria-label="Mühre dokun ve davetiyeyi aç"></button>
      <div class="slot">Referans 1</div>
    </div>
  </section>

  <!-- 2 • AÇIK ZARF + PLAK -->
  <section class="page" id="p2" data-w="1366" data-h="2207">
    <div class="bleed" data-img="envelope"></div>
    <div class="frame">
      <div class="art" data-img="envelope"></div>
      <div id="vinyl-ring"></div>
      <button id="vinyl" aria-label="Müziği başlat veya durdur"></button>
      <button class="hot" data-go="p3" aria-label="İleri"
              style="left:86.5%;top:.4%;width:13%;height:4.6%"></button>
      <div class="slot">Referans 2</div>
    </div>
  </section>

  <!-- 3 • HİKAYEMİZ -->
  <section class="page" id="p3" data-w="1366" data-h="2489">
    <div class="bleed" data-img="story"></div>
    <div class="frame">
      <div class="art" data-img="story"></div>
      <button class="hot" data-go="p5" aria-label="Detaylar için tıkla"
              style="left:63.5%;top:15.6%;width:21%;height:13.4%"></button>
      <button class="hot" data-go="p4" aria-label="İleri"
              style="left:82%;top:95.2%;width:17%;height:4.4%"></button>
      <button class="hot" data-back="1" aria-label="Geri"
              style="left:0;top:86%;width:14%;height:14%"></button>
      <div class="slot">Referans 3 — Hikayemiz</div>
    </div>
  </section>

  <!-- 4 • AİLEMİZ -->
  <section class="page" id="p4" data-w="1366" data-h="2409">
    <div class="bleed" data-img="family"></div>
    <div class="frame">
      <div class="art" data-img="family"></div>
      <button class="hot" data-go="p6" aria-label="İleri"
              style="left:82.5%;top:95.4%;width:16.5%;height:4.2%"></button>
      <button class="hot" data-back="1" aria-label="Geri"
              style="left:0;top:86%;width:14%;height:14%"></button>
      <div class="slot">Referans 4 — Ailemiz</div>
    </div>
  </section>

  <!-- 5 • DETAYLAR (konum + akış) -->
  <section class="page" id="p5" data-w="1366" data-h="2397">
    <div class="bleed" data-img="details"></div>
    <div class="frame">
      <div class="art" data-img="details"></div>
      <button class="hot" data-back="1" aria-label="Geri"
              style="left:79%;top:1.8%;width:15%;height:4.6%"></button>
      <button class="hot" id="map-hit" aria-label="Haritada aç"
              style="left:41%;top:39.2%;width:22.5%;height:4.3%"></button>
      <div class="slot">Referans 5 — Detaylar</div>
    </div>
  </section>

  <!-- 6 • RSVP -->
  <section class="page" id="p6" data-w="1366" data-h="2364">
    <div class="bleed" data-img="rsvp"></div>
    <div class="frame">
      <div class="art" data-img="rsvp"></div>
      <button class="hot" data-rsvp="evet" aria-label="Katılıyorum"
              style="left:22%;top:58%;width:22%;height:10%"></button>
      <button class="hot" data-rsvp="hayir" aria-label="Katılamıyorum"
              style="left:56%;top:58%;width:22%;height:10%"></button>
      <button class="hot" data-back="1" aria-label="Geri"
              style="left:0;top:86%;width:14%;height:14%"></button>
      <div class="slot">Referans 6 — RSVP</div>
    </div>
  </section>

  <!-- RSVP penceresi -->
  <div id="modal" role="dialog" aria-modal="true" aria-label="Katılım onayı">
    <div class="sheet">
      <div class="sheet-bar"><span>Katılım Onayı</span>
        <button class="sheet-close" id="modal-close" aria-label="Kapat">&times;</button></div>
      <div class="sheet-body">
        <iframe id="rsvp-frame" title="Katılım onayı" allow="clipboard-write"></iframe>
        <div id="rsvp-fallback">
          <p>Katılım formu burada açılamadı. Aşağıdaki düğmeyle formu açabilirsiniz.</p>
          <button id="rsvp-open">Katılım formunu aç</button>
        </div>
      </div>
      <div class="sheet-foot"><button id="rsvp-alt">Form görünmüyorsa buraya dokunun</button></div>
    </div>
  </div>

  <div id="hint">yukarı kaydırarak ilerleyin</div>
</div>

<script>
/* ===== MÜŞTERİ AYARLARI ================================================== */
const CONFIG = {
  mapUrl : "https://www.google.com/maps/search/?api=1&query=My+Garden+K%C4%B1r+D%C3%BC%C4%9F%C3%BCn+Salonu+Malatya",
  rsvpUrl: "https://web-production-f3f0f.up.railway.app/embed/aseldogumgunu"
};

/* ===== ÖLÇÜLER (referans görsellerden piksel ölçümüyle) ================== */
const GEO = {
  /* 1. sayfa — mühür (görsel yüzdesi) */
  seal : { cx:47.80, cy:65.78, r:5.60 },     /* r = görsel genişliğinin % */
  /* 2. sayfa — plak */
  vinyl: { cx:51.50, cy:35.30, r:14.80 }
};

/* ===== GÖRSELLER ========================================================= */
const ASSETS = {
  cover    : "assets/cover.webp",
  envelope : "assets/envelope.webp",
  story    : "assets/story.webp",
  family   : "assets/family.webp",
  details  : "assets/details.webp",
  rsvp     : "assets/rsvp.webp"
};

/* ===== KURULUM =========================================================== */
const stage = document.getElementById('stage');

document.querySelectorAll('[data-img]').forEach(el=>{
  const src = ASSETS[el.dataset.img];
  if (src) el.style.backgroundImage = `url("${src}")`;
});
document.querySelectorAll('.page').forEach(p=>{
  const key = p.querySelector('.art').dataset.img;
  if (!ASSETS[key]) p.classList.add('ph');
});

/* Sayfaları görsel oranına göre yerleştir (kırpma yok, bozulma yok) */
function layout(){
  const W = stage.clientWidth, H = stage.clientHeight;
  document.querySelectorAll('.page').forEach(p=>{
    const nw = +p.dataset.w, nh = +p.dataset.h;
    const s = Math.min(W/nw, H/nh);
    const fw = Math.round(nw*s), fh = Math.round(nh*s);
    const f = p.querySelector('.frame');
    f.style.width = fw+'px'; f.style.height = fh+'px';
    f.style.left = Math.round((W-fw)/2)+'px'; f.style.top = Math.round((H-fh)/2)+'px';
    if (p.id === 'p1') place(document.getElementById('seal-hit'), GEO.seal, fw, fh);
    if (p.id === 'p2'){
      place(document.getElementById('vinyl'), GEO.vinyl, fw, fh, ASSETS.envelope, nw, nh);
      place(document.getElementById('vinyl-ring'), GEO.vinyl, fw, fh);
    }
  });
}
function place(el, g, fw, fh, img, nw, nh){
  const d = fw * g.r*2/100;
  const x = fw*g.cx/100 - d/2, y = fh*g.cy/100 - d/2;
  el.style.left = x+'px'; el.style.top = y+'px';
  el.style.width = d+'px'; el.style.height = d+'px';
  if (img){ el.style.backgroundImage = 'url("'+img+'")';
            el.style.backgroundSize = fw+'px '+fh+'px';
            el.style.backgroundPosition = (-x)+'px '+(-y)+'px'; }
}
layout();
addEventListener('resize', layout);
addEventListener('orientationchange', ()=>setTimeout(layout,150));

/* ===== SAYFA GEÇİŞLERİ =================================================== */
const ORDER = ['p1','p2','p3','p4','p6'];   /* p5 = detay katmanı */
let current = 'p1', trail = [];
const hint = document.getElementById('hint');

function show(id){
  if (id === current) return;
  if (current !== 'p1') trail.push(current);
  const cur = document.getElementById(current);
  cur.classList.remove('on'); cur.classList.add('above');
  const nxt = document.getElementById(id);
  nxt.classList.remove('above'); nxt.classList.add('on');
  current = id;
  if (id === 'p2'){ hint.classList.add('on'); setTimeout(()=>hint.classList.remove('on'), 4000); }
}
function goBack(){
  const prev = trail.pop();
  if (!prev) return;
  document.getElementById(current).classList.remove('on');   /* aşağı iner */
  const p = document.getElementById(prev);
  p.classList.remove('above'); p.classList.add('on');
  current = prev;
}
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.go)));
document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',goBack));

let sx=0, sy=0;
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{
  if (current==='p1' || document.getElementById('modal').classList.contains('on')) return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if (Math.abs(dy)<60 || Math.abs(dy)<Math.abs(dx)) return;
  const i = ORDER.indexOf(current);
  if (dy<0 && i>-1 && i<ORDER.length-1) show(ORDER[i+1]); else if (dy>0) goBack();
},{passive:true});
addEventListener('keydown',e=>{
  if (e.key==='Escape') closeModal();
  if (current==='p1') return;
  const i = ORDER.indexOf(current);
  if ((e.key==='ArrowDown'||e.key==='ArrowRight'||e.key===' ') && i>-1 && i<ORDER.length-1) show(ORDER[i+1]);
  if (e.key==='ArrowUp'||e.key==='ArrowLeft') goBack();
});

/* ===== ZARF AÇILIŞI ====================================================== */
document.getElementById('seal-hit').addEventListener('click',()=>{
  if (document.body.classList.contains('opening')) return;
  document.body.classList.add('opening');
  setTimeout(()=>show('p2'), 420);
});

/* ===== MÜZİK — özgün enstrümantal (Web Audio) ============================ */
const Music = (()=>{
  let ctx, master, wet, timer, step=0, nextTime=0, on=false;
  const BPM=74, BEAT=60/BPM;
  const CHORDS=[[50,57,61,66,69],[47,54,57,62,66],[43,50,54,59,62],[45,52,57,61,64]];
  const ARP=[0,2,3,4,3,2,4,3];
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function reverb(){
    const len=Math.floor(ctx.sampleRate*2.8), buf=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8)*.5;}
    const cv=ctx.createConvolver(); cv.buffer=buf; return cv;
  }
  function pluck(f,t,dur,vol){
    const o1=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain();
    o1.type='triangle'; o2.type='sine'; o1.frequency.value=f; o2.frequency.value=f*2.003;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.014);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o1.connect(g);o2.connect(g);g.connect(master);g.connect(wet);
    o1.start(t);o2.start(t);o1.stop(t+dur+.05);o2.stop(t+dur+.05);
  }
  function pad(ch,t,dur){
    ch.slice(0,3).forEach((n,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
      o.type='sine'; o.frequency.value=hz(n-12);
      f.type='lowpass'; f.frequency.value=860;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.05-i*.008,t+1);
      g.gain.linearRampToValueAtTime(0,t+dur);
      o.connect(f);f.connect(g);g.connect(master);g.connect(wet);
      o.start(t);o.stop(t+dur+.1);
    });
  }
  function schedule(){
    while (nextTime < ctx.currentTime + .35){
      const ch=CHORDS[Math.floor(step/8)%CHORDS.length], k=step%8;
      if(k===0) pad(ch,nextTime,BEAT*4);
      pluck(hz(ch[ARP[k]]+(k===5?12:0)), nextTime, k%2?.95:1.6, k===0?.15:.1);
      if(k===3) pluck(hz(ch[0]-12), nextTime, 1.9, .085);
      nextTime += BEAT/2; step++;
    }
  }
  return { toggle(){
      if(!ctx){
        ctx=new (window.AudioContext||window.webkitAudioContext)();
        master=ctx.createGain(); master.gain.value=0; master.connect(ctx.destination);
        const rv=reverb(), rg=ctx.createGain(); rg.gain.value=.4;
        wet=ctx.createGain(); wet.gain.value=.3; wet.connect(rv); rv.connect(rg); rg.connect(ctx.destination);
      }
      if(ctx.state==='suspended') ctx.resume();
      on=!on;
      const now=ctx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(master.gain.value,now);
      master.gain.linearRampToValueAtTime(on?.5:0, now+(on?.9:.7));
      if(on){ nextTime=ctx.currentTime+.1; timer=setInterval(schedule,25); schedule(); }
      else  { setTimeout(()=>clearInterval(timer),800); }
      return on;
  }};
})();
const vinyl=document.getElementById('vinyl'), ring=document.getElementById('vinyl-ring');
vinyl.addEventListener('click',()=>{
  const playing=Music.toggle();
  vinyl.classList.toggle('playing',playing);
  ring.classList.toggle('on',playing);
  vinyl.style.animationPlayState = playing?'running':'paused';
});

/* ===== HARİTA + RSVP ===================================================== */
document.getElementById('map-hit').addEventListener('click',()=>window.open(CONFIG.mapUrl,'_blank','noopener'));
const modal=document.getElementById('modal'), frame=document.getElementById('rsvp-frame');
function closeModal(){ modal.classList.remove('on'); }
const fallback=document.getElementById('rsvp-fallback');
let rsvpTimer=null, rsvpLoaded=false;
frame.addEventListener('load',()=>{ rsvpLoaded=true; clearTimeout(rsvpTimer); fallback.classList.remove('show'); });
document.querySelectorAll('[data-rsvp]').forEach(b=>b.addEventListener('click',()=>{
  modal.classList.add('on');
  if(!frame.getAttribute('src')){
    frame.setAttribute('src', CONFIG.rsvpUrl);
    clearTimeout(rsvpTimer);
    rsvpTimer=setTimeout(()=>{ if(!rsvpLoaded) fallback.classList.add('show'); }, 4000);
  }
}));
const openRsvp=()=>window.open(CONFIG.rsvpUrl,'_blank','noopener');
document.getElementById('rsvp-open').addEventListener('click',openRsvp);
document.getElementById('rsvp-alt').addEventListener('click',openRsvp);
document.getElementById('modal-close').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });
</script>
</body>
</html>
