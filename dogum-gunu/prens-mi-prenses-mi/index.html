.skip{

  z-index:3;opacity:0;pointer-events:none;transition:opacity .6s ease;

  padding:9px 14px;border:1px solid rgba(255,248,236,.28);border-radius:100px;

/* etkileşim alanları */
.spot{
  position:absolute;z-index:3;border:0;padding:0;background:transparent;border-radius:16px;
  transition:transform .35s cubic-bezier(.2,.9,.3,1),box-shadow .35s ease,background .35s ease;
}
.spot:active{transform:scale(.965)}
@media(hover:hover){
  .spot:hover{background:rgba(255,253,246,.14);box-shadow:0 10px 30px rgba(160,124,34,.18)}
}
.spot.shell{border-radius:50% 50% 46% 46%/52% 52% 48% 48%}
.spot.pill{border-radius:100px}
.spot.shell.picked{background:rgba(255,255,255,.10)}
.spot.shell.picked.prens{box-shadow:0 0 40px 8px rgba(120,178,235,.55)}
.spot.shell.picked.prenses{box-shadow:0 0 40px 8px rgba(238,150,180,.55)}
.pick-ring{position:absolute;inset:-3%;border-radius:inherit;pointer-events:none;border:2px solid rgba(233,206,139,0)}
.picked .pick-ring{border-color:rgba(233,206,139,.85);animation:ringPulse 2.6s ease-in-out infinite}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.035);opacity:.35}}
.hint{
  position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 62%);
}
#invite.ready .spot.shell:not(.picked) .hint{animation:hintGlow 3.6s ease-in-out infinite}
.spot.prenses .hint{animation-delay:1.8s}
@keyframes hintGlow{0%,72%,100%{opacity:0}86%{opacity:.55}}
@media (prefers-reduced-motion:reduce){
  #invite.ready .spot.shell .hint{animation:none}
  .picked .pick-ring{animation:none}
}
.burst{position:fixed;inset:0;pointer-events:none;z-index:60}

<script>

/* ---- görseldeki geri sayım kutularının ölçüleri (1023 x 1537 px) ---- */
const CD_BOXES = [
  {x0:184, x1:319, cx:253.5, color:"#306490", fill:"rgb(238,220,205)"},  // GÜN
  {x0:338, x1:460, cx:399.5, color:"#B86266", fill:"rgb(239,220,205)"},  // SAAT
  {x0:479, x1:600, cx:535.0, color:"#B86266", fill:"rgb(239,220,205)"},  // DAKİKA
  {x0:620, x1:744, cx:681.5, color:"#B86266", fill:"rgb(238,218,202)"}   // SANİYE

const CD_GEO = { W:941, H:1672, patchTop:1098, patchH:51, inset:8, baseline:1142, digitH:34 };

/* ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const SEEN_KEY = "bday004_v2_seen";
const memStore = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return memStore[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ memStore[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete memStore[k]; } }
};
// eski sürümden kalan kayıt varsa temizle
store.del("bday004_seen");
if(location.search.indexOf("reset")>-1){ store.del(SEEN_KEY); store.del("bday004_guess"); }

function makePlayable(dataUri){
  try{
    const i = dataUri.indexOf(",");
    const mime = dataUri.slice(5, dataUri.indexOf(";"));
    const bin = atob(dataUri.slice(i+1));
    const buf = new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++) buf[k] = bin.charCodeAt(k);
    return URL.createObjectURL(new Blob([buf],{type:mime}));
  }catch(e){ return dataUri; }
}

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("on"), 2400);
}

/* ============================================================
   1) KAPAK -> 2) AÇILIŞ
   ============================================================ */
const VIDEO_SRC = "assets/kabuk-acilis.mp4";
const vid = $("#shellVid"), stage = $("#stage"), bloom = $("#bloom");
let started = false, finished = false;

vid.src = makePlayable(VIDEO_SRC);
vid.load();

$("#openBtn").addEventListener("click", startReveal, {passive:true});

function startReveal(){
  if(started) return;
  started = true;
  $("#reveal").hidden = false;
  requestAnimationFrame(()=>{
    $("#cover").style.transition = "opacity .55s ease";
    $("#cover").style.opacity = "0";
    setTimeout(()=>{ $("#cover").hidden = true; }, 600);
  });
  if(!reduceMotion) requestAnimationFrame(()=>stage.classList.add("rolling"));

  const p = vid.play();
  if(p && p.catch) p.catch(()=>{ vid.muted = true; vid.play().catch(()=>{}); });

  setTimeout(()=>$("#skipBtn").classList.add("on"), 2600);
  fxTimeline();
}
$("#skipBtn").addEventListener("click", ()=>finishReveal(false));

/* ---------- parçacıklar ---------- */
const fx = $("#fx"), fxc = fx.getContext("2d");
let parts = [], rays = [], fxOn = false, fxT0 = 0;
function sizeFx(){
  const d = Math.min(devicePixelRatio||1,2);
  fx.width = innerWidth*d; fx.height = innerHeight*d;
  fxc.setTransform(d,0,0,d,0,0);
}
sizeFx(); addEventListener("resize", sizeFx);

const PEARL = [["#FFFFFF","#FFE9F2"],["#FBD3E1","#F5A9C4"],["#CFE4F7","#9EC6EE"]];
function spawnPearl(){
  const w=innerWidth,h=innerHeight,c=PEARL[(Math.random()*PEARL.length)|0];
  parts.push({x:w*0.5+(Math.random()-.5)*w*0.30, y:h*0.50+(Math.random()-.5)*h*0.05,
    vx:(Math.random()-.5)*0.55, vy:-(0.55+Math.random()*1.5), r:1.6+Math.random()*6.2,
    a:0, af:.012+Math.random()*.02, life:0, max:150+Math.random()*160,
    c0:c[0], c1:c[1], sw:Math.random()*6.283, sp:.012+Math.random()*.03});
}
function spawnSpark(){
  const w=innerWidth,h=innerHeight;
  parts.push({x:w*0.5+(Math.random()-.5)*w*0.5, y:h*0.52+(Math.random()-.5)*h*0.18,
    vx:(Math.random()-.5)*.7, vy:-(0.2+Math.random()*.9), r:.7+Math.random()*1.7,
    a:0, af:.03, life:0, max:60+Math.random()*70, c0:"#FFFFFF", c1:"#FFE7B8",
    star:true, sw:Math.random()*6.28, sp:.06});
}
for(let i=0;i<11;i++) rays.push({ang:(-Math.PI/2)+(Math.random()-.5)*2.5, w:.02+Math.random()*.06, l:.5+Math.random()*.6, tw:Math.random()*6.28});

function fxTimeline(){ fxOn = true; fxT0 = performance.now(); requestAnimationFrame(fxLoop); }

function fxLoop(now){
  if(!fxOn) return;
  const t = (vid.currentTime && !vid.paused) ? vid.currentTime : (now-fxT0)/1000;
  const w = innerWidth, h = innerHeight;
  fxc.clearRect(0,0,w,h);
  const open = Math.min(Math.max((t-0.95)/1.5,0),1);
  const fade = t>6.9 ? Math.max(0,1-(t-6.9)/1.2) : 1;

  if(open>0){
    fxc.save(); fxc.globalCompositeOperation="lighter"; fxc.translate(w*0.5,h*0.50);
    rays.forEach(r=>{
      r.tw += .02;
      const amp=(0.45+0.55*Math.sin(r.tw))*open*fade, len=h*r.l*(0.55+0.45*open);
      const g=fxc.createLinearGradient(0,0,Math.cos(r.ang)*len,Math.sin(r.ang)*len);
      g.addColorStop(0,"rgba(255,246,224,"+(0.30*amp)+")");
      g.addColorStop(.45,"rgba(255,225,240,"+(0.12*amp)+")");
      g.addColorStop(1,"rgba(255,255,255,0)");
      fxc.beginPath(); fxc.moveTo(0,0);
      fxc.lineTo(Math.cos(r.ang-r.w)*len,Math.sin(r.ang-r.w)*len);
      fxc.lineTo(Math.cos(r.ang+r.w)*len,Math.sin(r.ang+r.w)*len);
      fxc.closePath(); fxc.fillStyle=g; fxc.fill();
    });
    const gg=fxc.createRadialGradient(0,0,0,0,0,Math.min(w,h)*0.42*open);
    gg.addColorStop(0,"rgba(255,250,235,"+(0.42*open*fade)+")");
    gg.addColorStop(.5,"rgba(255,220,240,"+(0.14*open*fade)+")");
    gg.addColorStop(1,"rgba(255,255,255,0)");
    fxc.fillStyle=gg; fxc.beginPath(); fxc.arc(0,0,Math.min(w,h)*0.45,0,6.283); fxc.fill();
    fxc.restore();
    const rate = (reduceMotion?0.6:3)*open*fade;
    for(let i=0;i<rate;i++) spawnPearl();
    if(!reduceMotion && Math.random()<0.9*open*fade) spawnSpark();
  }

  fxc.save(); fxc.globalCompositeOperation="lighter";
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.life++; p.sw+=p.sp; p.x+=p.vx+Math.sin(p.sw)*0.5; p.y+=p.vy; p.vy*=0.995;
    p.a=Math.min(p.a+p.af,1)*(1-p.life/p.max);
    if(p.life>p.max||p.y<-40){ parts.splice(i,1); continue; }
    const al=Math.max(0,p.a)*fade;
    if(p.star){
      fxc.globalAlpha=al; fxc.fillStyle=p.c0; fxc.beginPath();
      for(let k=0;k<4;k++){
        const a0=p.sw+k*Math.PI/2;
        fxc.lineTo(p.x+Math.cos(a0)*p.r*3, p.y+Math.sin(a0)*p.r*3);
        fxc.lineTo(p.x+Math.cos(a0+Math.PI/4)*p.r*0.8, p.y+Math.sin(a0+Math.PI/4)*p.r*0.8);
      }
      fxc.closePath(); fxc.fill();
    }else{
      const g=fxc.createRadialGradient(p.x-p.r*.35,p.y-p.r*.4,p.r*.1,p.x,p.y,p.r*2.4);
      g.addColorStop(0,p.c0); g.addColorStop(.42,p.c1); g.addColorStop(1,"rgba(255,255,255,0)");
      fxc.globalAlpha=al; fxc.fillStyle=g;
      fxc.beginPath(); fxc.arc(p.x,p.y,p.r*2.2,0,6.283); fxc.fill();
    }
  }
  fxc.restore(); fxc.globalAlpha=1;

  if(t>=6.95 && !finished){
    const k=Math.min((t-6.95)/0.85,1);
    bloom.style.opacity=k.toFixed(3);
    bloom.style.transform="scale("+(1+k*0.25).toFixed(3)+")";
  }
  if(t>=7.55 && !finished){ finishReveal(false); }
  requestAnimationFrame(fxLoop);
}
vid.addEventListener("ended", ()=>{ if(!finished) finishReveal(false); });

function finishReveal(instant){
  if(finished) return;
  finished = true; fxOn = false;
  store.set(SEEN_KEY,"1");

  const inv = $("#invite");
  inv.classList.add("on");
  document.body.classList.add("is-invite");
  if(!instant) inv.classList.add("enter");
  $("#skipBtn").classList.remove("on");

  const done = ()=>{
    $("#reveal").hidden = true; $("#cover").hidden = true;
    try{ vid.pause(); }catch(e){}
    inv.classList.add("ready");
    sizeCd(); drawCd();
  };
  if(instant){ done(); }
  else{
    bloom.style.transition="opacity .7s ease";
    setTimeout(()=>{ bloom.style.opacity="0"; },30);
    setTimeout(done,820);
  }
}

if(!CONFIG.herZamanOynat && store.get(SEEN_KEY)==="1"){
  started = true; $("#cover").hidden = true; finishReveal(true);
}

/* ============================================================
   CANLI GERİ SAYIM — görseldeki kutuların içine çizilir
   ============================================================ */
const posterImg = $("#posterImg");
const cdCv = $("#cdCanvas"), cdx = cdCv.getContext("2d");
let cdReady = false;

posterImg.addEventListener("load", ()=>{ cdReady = true; sizeCd(); drawCd(); });
if(posterImg.complete && posterImg.naturalWidth) cdReady = true;

function sizeCd(){
  const r = cdCv.getBoundingClientRect();
  if(!r.width) return;
  const d = Math.min(devicePixelRatio||1, 2.5);
  cdCv.width  = Math.round(r.width*d);
  cdCv.height = Math.round(r.height*d);
}
addEventListener("resize", ()=>{ sizeCd(); drawCd(); });
addEventListener("orientationchange", ()=>setTimeout(()=>{ sizeCd(); drawCd(); },260));

function remaining(){
  const diff = new Date(CONFIG.tarihISO).getTime() - Date.now();
  if(diff<=0) return {d:0,h:0,m:0,s:0,bitti:true};
  return {
    d: Math.floor(diff/86400000),
    h: Math.floor(diff%86400000/3600000),
    m: Math.floor(diff%3600000/60000),
    s: Math.floor(diff%60000/1000),
    bitti:false
  };
}
const pad = n=>String(n).padStart(2,"0");

function drawCd(){
  if(!cdCv.width || !cdReady) return;
  const S = cdCv.width / CD_GEO.W;              // görsel ölçeği
  const r = remaining();
  const vals = [String(r.d), pad(r.h), pad(r.m), pad(r.s)];

  cdx.setTransform(1,0,0,1,0,0);
  cdx.clearRect(0,0,cdCv.width,cdCv.height);

  CD_BOXES.forEach((b,i)=>{
    // 1) kutu içindeki basılı rakamı, kutunun kendi dolgu rengiyle kapat
    const px = (b.x0+CD_GEO.inset)*S;
    const pw = (b.x1-b.x0-2*CD_GEO.inset)*S;
    cdx.fillStyle = b.fill;
    cdx.fillRect(px, CD_GEO.patchTop*S, pw, CD_GEO.patchH*S);
    // 2) canlı rakamı, orijinaliyle aynı taban çizgisine yaz
    let fs = 54*S;
    cdx.font = '400 '+fs+'px "Didot","Times New Roman",Times,serif';
    const m = cdx.measureText("0");
    const asc = m.actualBoundingBoxAscent || fs*0.66;
    fs = fs * (CD_GEO.digitH*S) / asc;          // rakam yüksekliğini görsele eşitle
    cdx.font = '400 '+fs+'px "Didot","Times New Roman",Times,serif';
    cdx.textAlign = "center";
    cdx.textBaseline = "alphabetic";
    cdx.shadowColor = "rgba(120,88,54,.20)";
    cdx.shadowBlur = 2*S; cdx.shadowOffsetY = 1*S;
    cdx.fillStyle = b.color;
    cdx.fillText(vals[i], b.cx*S, CD_GEO.baseline*S);
    cdx.shadowColor = "transparent"; cdx.shadowBlur = 0; cdx.shadowOffsetY = 0;
  });
}
setInterval(()=>{ drawCd(); tickSheet(); }, 1000);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ sizeCd(); drawCd(); });

function tickSheet(){
  const r = remaining();
  const set=(id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=pad(v); };
  set("d2",r.d); set("h2",r.h); set("m2",r.m); set("s2",r.s);
}

/* ============================================================
   ETKİLEŞİMLER
   ============================================================ */
let guess = store.get("bday004_guess") || null;
if(guess) markGuess(guess,false);

function markGuess(val, celebrate){
  $$(".spot.shell").forEach(b=>b.classList.toggle("picked", b.dataset.val===val));
  if(celebrate){
    const el = $('.spot.shell[data-val="'+val+'"]');
    const rc = el.getBoundingClientRect();
    pearlBurst(rc.left+rc.width/2, rc.top+rc.height*0.55, val);
  }
}

document.addEventListener("click", e=>{
  const b = e.target.closest(".spot");
  if(!b) return;
  const act = b.dataset.act;
  if(act==="guess"){
    guess = b.dataset.val;
    store.set("bday004_guess", guess);
    markGuess(guess,true);
    openGuess(guess);
  }
  else if(act==="date") openDate();
  else if(act==="time") openTime();
  else if(act==="place") openPlace();
  else if(act==="rsvp") openRsvp();
});

/* ---------- inci patlaması ---------- */
const bc = $("#burst"), bcx = bc.getContext("2d");
let bParts = [], bRun = false;
function sizeB(){
  const d=Math.min(devicePixelRatio||1,2);
  bc.width=innerWidth*d; bc.height=innerHeight*d; bcx.setTransform(d,0,0,d,0,0);
}
sizeB(); addEventListener("resize", sizeB);

function pearlBurst(x,y,kind){
  if(reduceMotion) return;
  const tint = kind==="prens" ? ["#CFE4F7","#8FBEEA"] : ["#FBD3E1","#EE9CBB"];
  for(let i=0;i<46;i++){
    const a=Math.random()*6.283, sp=1.5+Math.random()*5.5;
    bParts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.6,r:1.4+Math.random()*5,a:1,
      c0:Math.random()<.4?"#FFFFFF":tint[0], c1:tint[1], g:.11+Math.random()*.06});
  }
  if(!bRun){ bRun=true; requestAnimationFrame(bLoop); }
}
function bLoop(){
  const w=innerWidth,h=innerHeight;
  bcx.clearRect(0,0,w,h);
  bcx.save(); bcx.globalCompositeOperation="lighter";
  for(let i=bParts.length-1;i>=0;i--){
    const p=bParts[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=.985; p.a-=.014;
    if(p.a<=0){ bParts.splice(i,1); continue; }
    const g=bcx.createRadialGradient(p.x-p.r*.35,p.y-p.r*.4,p.r*.1,p.x,p.y,p.r*2.2);
    g.addColorStop(0,p.c0); g.addColorStop(.45,p.c1); g.addColorStop(1,"rgba(255,255,255,0)");
    bcx.globalAlpha=Math.max(0,p.a); bcx.fillStyle=g;
    bcx.beginPath(); bcx.arc(p.x,p.y,p.r*2,0,6.283); bcx.fill();
  }
  bcx.restore(); bcx.globalAlpha=1;
  if(bParts.length) requestAnimationFrame(bLoop); else { bRun=false; bcx.clearRect(0,0,w,h); }
}

    </button>
    <button class="act" data-close onclick="openRsvpDelayed()">
      <span class="ic">✉️</span><span class="tx"><span class="tt">Katılım bildir</span><span class="ss">Seni aramızda görmek isteriz</span></span><span class="ar">›</span>
    </button>

}

function openDate(){
  openSheet(`
    <h3>Takvime Ekle</h3>
    <p class="sub">${CONFIG.tarihYazi} · ${CONFIG.saatYazi}${CONFIG.bitisYazi?" – "+CONFIG.bitisYazi:""}</p>
    <div class="divider"></div>
    <button class="act blue" onclick="gcal()">
      <span class="ic">📅</span><span class="tx"><span class="tt">Google Takvim</span><span class="ss">Tarayıcıda açılır</span></span><span class="ar">›</span>
    </button>
    <button class="act" onclick="ics()">
      <span class="ic">🍏</span><span class="tx"><span class="tt">iPhone / Outlook (.ics)</span><span class="ss">Dosyayı indir ve aç</span></span><span class="ar">›</span>
    </button>
    <div class="info-row"><span class="k">Tarih</span><span class="v">${CONFIG.tarihYazi}</span></div>
    <div class="info-row"><span class="k">Saat</span><span class="v">${CONFIG.saatYazi}${CONFIG.bitisYazi?" – "+CONFIG.bitisYazi:""}</span></div>

    ${CLOSE}`);
}
function dtLocal(iso){ return iso.replace(/[-:]/g,"").replace(".000",""); }
function gcal(){
  const s=dtLocal(CONFIG.tarihISO), e=dtLocal(CONFIG.bitisISO||CONFIG.tarihISO);
  open("https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(CONFIG.baslik)
    +"&dates="+s+"/"+e+"&details="+encodeURIComponent(CONFIG.altBaslik)
    +"&location="+encodeURIComponent(CONFIG.adres),"_blank");
}
function ics(){
  const s=dtLocal(CONFIG.tarihISO), e=dtLocal(CONFIG.bitisISO||CONFIG.tarihISO);
  const body=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//BDAY-004//TR","BEGIN:VEVENT",
    "UID:"+Date.now()+"@bday004","DTSTAMP:"+dtLocal(new Date().toISOString().slice(0,19)),
    "DTSTART:"+s,"DTEND:"+e,"SUMMARY:"+CONFIG.baslik,"DESCRIPTION:"+CONFIG.altBaslik,
    "LOCATION:"+CONFIG.adres,"BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY",
    "DESCRIPTION:Yarın kutlama var!","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  const url=URL.createObjectURL(new Blob([body],{type:"text/calendar;charset=utf-8"}));
  const a=document.createElement("a"); a.href=url; a.download="davetiye.ics";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{a.remove(); URL.revokeObjectURL(url);},900);
  toast("Takvim dosyası indiriliyor");
}

function openTime(){
